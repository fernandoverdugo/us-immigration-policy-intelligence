name: Container checks

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "api/**"
      - "src/retrieval/**"
      - "web/**"
      - "analysis/retrieval/results/**"
      - "analysis/nlp/results/document_metadata.csv"
      - "analysis/nlp/cluster_labels.csv"
      - "requirements*.txt"
      - ".github/workflows/container-checks.yml"
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "api/**"
      - "src/retrieval/**"
      - "web/**"
      - "analysis/retrieval/results/**"
      - "analysis/nlp/cluster_labels.csv"
      - "requirements*.txt"
  workflow_dispatch:

concurrency:
  group: container-checks-main
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build container image
        run: docker build -t immigration-policy-intelligence:test .
      - name: Start container
        run: |
          docker run -d --rm             --name immigration-policy-intelligence             -p 8000:8000             immigration-policy-intelligence:test
      - name: Wait for health endpoint
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs immigration-policy-intelligence
          exit 1
      - name: Verify web interface
        run: |
          curl --fail --silent http://127.0.0.1:8000/ | grep "U.S. Immigration Policy Intelligence"
      - name: Verify OpenAPI
        run: |
          curl --fail --silent http://127.0.0.1:8000/openapi.json | grep '"/search"'
      - name: Verify search filters
        run: |
          curl --fail --silent http://127.0.0.1:8000/filters \
            | python -c 'import json,sys; d=json.load(sys.stdin); assert "uscis" in d["agencies"]; assert len(d["topics"])==9'
      - name: Verify semantic search endpoint
        run: |
          curl --fail --silent --get             --data-urlencode "q=work permits for Liberians protected from deportation"             --data-urlencode "k=3"             http://127.0.0.1:8000/search             | python -c 'import json,sys; d=json.load(sys.stdin); assert d["count"]==3; print(d["results"][0]["title"])'
      - name: Verify rich document endpoint
        run: |
          curl --fail --silent http://127.0.0.1:8000/documents/2017-00902 \
            | python -c 'import json,sys; d=json.load(sys.stdin); assert d["abstract"]; assert d["cfr_references"]; print(d["title"])'
      - name: Verify deployment metadata contract
        run: |
          docker exec immigration-policy-intelligence \
            python -c 'from api.main import health; assert "deployment_commit" in health()'
      - name: Container logs
        if: always()
        run: docker logs immigration-policy-intelligence || true
