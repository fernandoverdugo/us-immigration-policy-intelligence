name: Corpus quality audit

on:
  push:
    branches: [main]
    paths:
      - "src/ingestion/**"
      - "scripts/fetch_federal_register.py"
      - "scripts/build_corpus_quality_report.py"
      - "tests/test_filtering.py"
      - "database/queries/**"
      - "scripts/run_sql_analysis.py"
      - ".github/workflows/corpus-quality.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: immigration_policy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d immigration_policy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    permissions:
      contents: write
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/immigration_policy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m scripts.fetch_federal_register
      - run: python -m scripts.build_corpus_quality_report
      - run: python -m scripts.load_postgres
      - run: python -m scripts.run_sql_analysis
      - name: Preserve aggregate SQL outputs
        run: |
          mkdir -p analysis/outputs
          cp data/processed/sql/*.csv analysis/outputs/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/outputs analysis/corpus_snapshot.json
          if ! git diff --cached --quiet; then
            git commit -m "Update full-corpus SQL outputs"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: full-corpus-analysis
          path: |
            corpus_quality_summary.json
            data/processed/federal_register_corpus.json
            data/processed/sql_summary.json
            data/processed/sql/*.csv
            analysis/corpus_snapshot.json
          retention-days: 7
