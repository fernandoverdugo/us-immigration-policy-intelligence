name: Dependency lock

on:
  push:
    branches: [main]
    paths:
      - "requirements.txt"
      - "requirements-api.txt"
      - "requirements-retrieval.txt"
      - ".github/workflows/dependency-lock.yml"
  workflow_dispatch:

concurrency:
  group: dependency-lock-main
  cancel-in-progress: true

jobs:
  lock:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-api.txt
            requirements-retrieval.txt
      - run: python -m pip install -r requirements-api.txt
      - name: Freeze resolved environment
        run: |
          python -m pip freeze --local | LC_ALL=C sort > requirements-lock.txt
          cat requirements-lock.txt
      - name: Preserve lock file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requirements-lock.txt
          if ! git diff --cached --quiet; then
            git commit -m "Update resolved dependency lock"
            git pull --rebase origin main
            git push
          fi
