name: Retrieval benchmark

on:
  push:
    branches: [main]
    paths:
      - "scripts/run_retrieval_benchmark.py"
      - "tests/test_retrieval_benchmark.py"
      - "analysis/retrieval/benchmark_queries.csv"
      - "analysis/nlp/results/**"
      - "src/retrieval/embedding.py"
      - "requirements.txt"
      - "requirements-retrieval.txt"
      - ".github/workflows/retrieval-benchmark.yml"
  workflow_dispatch:

concurrency:
  group: retrieval-benchmark-main
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-retrieval.txt
      - run: python -m pip install -r requirements-retrieval.txt
      - run: python -m pytest -q
      - run: python -m scripts.run_retrieval_benchmark
      - name: Verify retrieval outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          import pandas as pd

          base = Path("analysis/retrieval/results")
          expected = {
              "semantic_embeddings.npy",
              "embedding_index.csv",
              "benchmark_results.csv",
              "retrieval_examples.csv",
              "retrieval_summary.json",
          }
          assert all((base / name).exists() for name in expected)

          summary = json.loads((base / "retrieval_summary.json").read_text())
          benchmark = pd.read_csv("analysis/retrieval/benchmark_queries.csv")
          index = pd.read_csv(base / "embedding_index.csv")

          assert summary["queries"] == len(benchmark)
          assert summary["documents"] == len(index)
          assert summary["documents"] > 0
          assert summary["embedding_runtime"] == "fastembed-onnx"
          print(summary)
          PY
      - name: Preserve validated retrieval results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/retrieval/results
          if ! git diff --cached --quiet; then
            git commit -m "Update FastEmbed retrieval results"
            git pull --rebase origin main
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: semantic-retrieval-benchmark
          path: analysis/retrieval/results/
          retention-days: 7
